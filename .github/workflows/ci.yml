name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff format
        run: ruff format --check src tests
      - name: Ruff lint
        run: ruff check src tests
      - name: Mypy (public API)
        run: mypy
      - name: MkDocs build
        run: mkdocs build --strict

  test:
    name: pytest (py${{ matrix.python-version }}${{ matrix.os == 'macos-latest' && ', macOS' || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package (dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Pytest + coverage gate
        run: |
          coverage run -m pytest -m "not slow" --tb=short
          coverage report
      - name: Examples
        run: |
          python examples/quickstart.py
          python examples/from_csv.py

  extras:
    name: dependency smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Import runtime deps
        run: |
          python -c "import highspy, cvxpy, pandas; import partialid; print(partialid.__version__)"
      - name: Pytest (not slow)
        run: python -m pytest -m "not slow" --tb=line -q

  build:
    name: build sdist/wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - name: Sdist policy check
        run: |
          tar -tzf dist/partialid-*.tar.gz | tee /tmp/sdist.txt
          if grep -E 'papers/|latex/|Figures/|benchmarks/|\.pdf$' /tmp/sdist.txt; then
            echo "Research collateral leaked into sdist" >&2
            exit 1
          fi
          grep -q 'src/partialid/__init__.py' /tmp/sdist.txt
          grep -q 'src/partialid/py.typed' /tmp/sdist.txt
          grep -q 'LICENSE' /tmp/sdist.txt
          grep -q 'README.md' /tmp/sdist.txt
